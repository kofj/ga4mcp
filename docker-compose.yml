services:
  ga4mcp:
    build: .
    image: "${GA4MCP_IMAGE:-ga4mcp:local}"
    restart: unless-stopped
    user: "${GA4MCP_UID:-1000}:${GA4MCP_GID:-1000}"
    ports:
      - "${GA4MCP_PORT:-8080}:8080"
    env_file:
      - "${GA4MCP_CONFIG_DIR:-${HOME}/.config/ga4mcp}/.env"
    environment:
      GA4MCP_AUTH: oauth
      GA4MCP_TOKEN_FILE: /data/token.json
    volumes:
      - "${GA4MCP_CONFIG_DIR:-${HOME}/.config/ga4mcp}:/data"
    healthcheck:
      test: ["CMD", "/usr/local/bin/ga4mcp", "-healthcheck", "-addr", "127.0.0.1:8080"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
